services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_REPORT_EMAIL: ${NEXT_PUBLIC_REPORT_EMAIL:-}
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
